<!DOCTYPE html>
<html>
<head>
<title>All Vendors - OSARE</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:20px}
h1{text-align:center;color:#1e3a8a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:20px auto}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.btn{display:block;text-align:center;background:#25d366;color:white;padding:10px;border-radius:8px;text-decoration:none;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<h1>40 Safari & Tour Vendors</h1>
<a href="/" style="display:block;text-align:center;margin-bottom:20px;">← Back Home</a>
<div id="grid" class="grid">Loading...</div>

<script>
fetch('/api/vendors/tourist')
.then(r=>r.json())
.then(data=>{
  document.getElementById('grid').innerHTML = data.map(v=>`
    <div class="card">
      <img src="${v.image}">
      <h3>${v.name}</h3>
      <p>📍 ${v.location}</p>
      <p>${v.description}</p>
      <p style="color:#f97316;font-weight:bold">${v.price_label}</p>
      <a href="${v.url}" target="_blank" class="btn">WhatsApp</a>
    </div>
  `).join('')
})
</script>
</body>
</html>
